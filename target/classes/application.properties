# CyberGuard - Data Access Log Analyzer
# Spring Boot Application Properties

# Application naming and description
spring.application.name=cyberguard-data-access-analyzer
server.servlet.context-path=/

# Server Configuration
# Support PORT environment variable for Render deployment
server.port=${PORT:8080}

# Logging
logging.level.root=INFO
logging.level.com.cyberguard=INFO
spring.main.banner-mode=off

# Embedded Tomcat Settings
server.tomcat.threads.max=200
server.tomcat.threads.min-spare=10
server.tomcat.connection-timeout=20000ms

# SQLite Database
# Uses environment variable DB_PATH if set, otherwise defaults to data_access_logs.db
# Example: export DB_PATH=/data/app/data_access_logs.db

# Spring Boot version
spring.boot.version=3.2.5

# Disable unused Spring features for optimized startup
spring.jmx.enabled=false
