services:
  - type: web
    name: cyberguard-data-access-analyzer
    env: docker
    plan: free
    dockerfilePath: ./Dockerfile
    envVars:
      - key: PORT
        value: 8080
      - key: DB_HOST
        fromDatabase:
          name: cyberguard-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: cyberguard-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: cyberguard-db
          property: database
      - key: DB_USER
        fromDatabase:
          name: cyberguard-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: cyberguard-db
          property: password
    healthCheckPath: /
    autoDeploy: true

databases:
  - name: cyberguard-db
    plan: free
