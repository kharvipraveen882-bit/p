services:
  - type: web
    name: cyberguard-data-access-analyzer
    env: docker
    plan: free
    dockerfilePath: ./Dockerfile
    disk:
      name: database
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: DB_PATH
        value: /data/data_access_logs.db
      - key: PORT
        value: 8080
      - key: JAVA_OPTS
        value: "-Xmx512m -Xms256m"
    healthCheckPath: /
    healthCheckInterval: 30
    autoDeploy: true

