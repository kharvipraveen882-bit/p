# CyberGuard - Data Access Log Analyzer
# Spring Boot Application Properties

# Application naming and description
spring.application.name=cyberguard-data-access-analyzer
server.servlet.context-path=/

# Server Configuration
# Support PORT environment variable for Render deployment
server.port=${PORT:8080}

# Logging
logging.level.root=INFO
logging.level.com.cyberguard=INFO
spring.main.banner-mode=off

# Embedded Tomcat Settings
server.tomcat.threads.max=200
server.tomcat.threads.min-spare=10
server.tomcat.connection-timeout=20000ms

# PostgreSQL Database
# These are provided by Render environment variables
spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate settings
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Disable unused Spring features for optimized startup
spring.jmx.enabled=false
 