version: '3.8'

services:
  cyberguard:
    build: .
    container_name: cyberguard-app
    ports:
      - "8080:8080"
    environment:
      PORT: 8080
      DB_PATH: /data/data_access_logs.db
      JAVA_OPTS: -Xmx512m -Xms256m
    volumes:
      - cyberguard-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  cyberguard-data:
    driver: local
